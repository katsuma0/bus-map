# Pulls the open data this project needs onto the branch. GitHub's runners
# can reach gtfs-data.jp and Overpass; the cloud sandbox this was built in
# could not, so the fetch lives here instead of in a local script.
name: fetch-data
on:
  workflow_dispatch:
  push:
    branches: ["feat/tsukuba-bus-timelapse"]
    paths: [".github/workflows/fetch-data.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Tsukuba City GTFS-JP feeds (CC BY 4.0)
        run: |
          set -eux
          mkdir -p data/gtfs
          curl -fsSL --retry 3 -o data/gtfs/tsukubus.zip \
            "https://api.gtfs-data.jp/v2/organizations/tsukubacity/feeds/TSUKUBUS/files/feed.zip"
          curl -fsSL --retry 3 -o data/gtfs/tsukubane.zip \
            "https://api.gtfs-data.jp/v2/organizations/tsukubacity/feeds/TSUKUBANEGO/files/feed.zip"
          curl -fsSL --retry 3 -o data/gtfs/tsuchimaru.zip \
            "https://api.gtfs-data.jp/v2/organizations/tsuchiuracity/feeds/tsuchimarubus/files/feed.zip" || rm -f data/gtfs/tsuchimaru.zip
          for z in data/gtfs/*.zip; do echo "== $z"; unzip -l "$z"; done
      - name: Download OSM bus route relations around Tsukuba (ODbL)
        # overpass-api.de refuses GitHub runner IPs, so walk a list of mirrors
        # and keep going without OSM if every one of them says no.
        continue-on-error: true
        run: |
          set -ux
          mkdir -p data/osm
          cat > /tmp/q.overpass <<'Q'
          [out:json][timeout:300];
          relation["route"="bus"](35.85,139.85,36.35,140.35);
          out body geom;
          Q
          ok=0
          for ep in https://overpass.kumi.systems/api/interpreter \
                    https://overpass.private.coffee/api/interpreter \
                    https://lz4.overpass-api.de/api/interpreter \
                    https://overpass-api.de/api/interpreter \
                    https://overpass.osm.jp/api/interpreter; do
            echo "== $ep"
            if curl -sS -A "bus-map-fetch/1.0 (github.com/katsuma0/bus-map)" -H "Accept: */*" \
                 --max-time 400 --data-urlencode "data@/tmp/q.overpass" "$ep" \
                 -o /tmp/overpass.json -w "http %{http_code}\n" && python3 -c "import json,sys; d=json.load(open('/tmp/overpass.json')); sys.exit(0 if d.get('elements') else 1)"; then
              ok=1; break
            fi
            head -c 400 /tmp/overpass.json || true; echo
          done
          test "$ok" = 1
          python3 scripts/osm_routes_to_geojson.py /tmp/overpass.json data/osm/bus_routes.geojson
          ls -la data/osm
      - name: Commit fetched data back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gtfs data/osm
          git commit -m "chore: fetch tsukuba gtfs and osm routes" || echo "nothing new"
          git push
