<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tsukuba Buses</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts/Montserrat.css">
<link rel="stylesheet" href="fonts/Inter.css">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #9a9da6;
    font-family: Inter, system-ui, sans-serif;
    overflow: hidden;
  }
  body {
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
  }
  #stage {
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* The canvas keeps its 1080x1920 pixel buffer; CSS only scales the box. */
  #frame {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    aspect-ratio: 9 / 16;
    background: #07080c;
  }
  #controls {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    font-size: 13px;
    background: #0d0e12;
    border-top: 1px solid #1c1e24;
    user-select: none;
  }
  #play {
    width: 72px;
    padding: 6px 0;
    border: 1px solid #2b2e36;
    border-radius: 6px;
    background: #15171c;
    color: #e6e7ea;
    font: inherit;
    cursor: pointer;
  }
  #play:hover { background: #1f2229; }
  #scrub { flex: 1 1 auto; accent-color: #f2c230; }
  #time {
    min-width: 150px;
    font-variant-numeric: tabular-nums;
    color: #f2c230;
  }
  #hint { color: #6f737d; }
  #status {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8c8f99;
    font-size: 14px;
    letter-spacing: 0.1em;
    pointer-events: none;
  }
  #status:empty { display: none; }

  /* ?record=1: the frame alone, pixel-exact at the top-left for screenshots. */
  body.record { display: block; }
  body.record #stage { display: block; }
  body.record #frame {
    position: absolute;
    left: 0;
    top: 0;
    width: 1080px;
    height: 1920px;
    max-width: none;
    max-height: none;
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="frame" width="1080" height="1920"></canvas></div>
  <div id="controls">
    <button id="play" type="button" title="Space">Play</button>
    <input id="scrub" type="range" min="0" max="10000" step="1" value="0">
    <span id="time"></span>
    <span id="hint">space: play / pause</span>
  </div>
  <div id="status">LOADING</div>
  <script src="app.js"></script>
</body>
</html>
